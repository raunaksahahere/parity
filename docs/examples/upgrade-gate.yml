# Block a promotion if the staging endpoint no longer behaves like the reference model.
name: parity-upgrade-gate
on:
  workflow_dispatch:
  pull_request:
    paths: ["deploy/inference/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raunaksahahere/llm-parity@v0.1.0
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}   # read from the environment only
        with:
          model: Qwen/Qwen3-0.6B
          revision: c1899de289a04d12100db370d81485cdf75e47ca
          target: https://staging.example.com/v1
          served-model: qwen3-0.6b
          api-key-env: STAGING_API_KEY
          calibration: ci/parity-calibration.json
          budget: "8000"
          fail-on: deviation
